<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhantomPen OS — Private Creative Workspace</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a78bfa">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app">
    <!-- Boot Screen -->
    <div id="boot-screen">
      <div class="boot-inner">
        <div class="boot-logo">
          <span class="ghost-icon">◈</span>
          <h1>PhantomPen<span class="os-tag">OS</span></h1>
        </div>
        <div class="boot-bar-wrap">
          <div class="boot-bar"><div class="boot-fill"></div></div>
        </div>
        <p class="boot-status">Initializing secure workspace...</p>
      </div>
    </div>

    <!-- Unlock Screen -->
    <div id="unlock-screen" class="hidden">
      <div class="unlock-inner">
        <div class="lock-icon">🔒</div>
        <h2>Enter Passphrase</h2>
        <p class="unlock-sub">All data is encrypted locally. Nothing leaves your device.</p>
        <input type="password" id="passphrase-input" placeholder="Enter passphrase..." autocomplete="off" />
        <button id="unlock-btn" class="btn-primary">Unlock Workspace</button>
        <button id="create-btn" class="btn-ghost">Create New Vault</button>
        <p class="unlock-hint" id="unlock-hint"></p>
      </div>
    </div>

    <!-- Main Workspace -->
    <div id="workspace" class="hidden">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <span class="ghost-icon-sm">◈</span>
          <span class="brand-sm">PhantomPen<em>OS</em></span>
          <button id="lock-btn" title="Lock Workspace">🔒</button>
        </div>

        <div class="sidebar-section">
          <div class="section-label">WORKSPACE</div>
          <button class="nav-btn active" data-panel="editor" onclick="switchPanel('editor')">
            <span>✏️</span> Editor
          </button>
          <button class="nav-btn" data-panel="files" onclick="switchPanel('files')">
            <span>📁</span> Files
          </button>
          <button class="nav-btn" data-panel="history" onclick="switchPanel('history')">
            <span>🕐</span> History
          </button>
          <button class="nav-btn" data-panel="share" onclick="switchPanel('share')">
            <span>🔗</span> Share
          </button>
          <button class="nav-btn" data-panel="ai" onclick="switchPanel('ai')">
            <span>🤖</span> AI Assistant
          </button>
          <button class="nav-btn" data-panel="settings" onclick="switchPanel('settings')">
            <span>⚙️</span> Settings
          </button>
        </div>

        <div class="sidebar-section">
          <div class="section-label">DOCUMENTS</div>
          <div id="doc-list"></div>
          <button class="new-doc-btn" onclick="newDocument()">+ New Document</button>
        </div>

        <div class="sidebar-footer">
          <div class="vault-status">
            <span class="status-dot"></span>
            <span id="vault-label">Vault locked</span>
          </div>
          <div class="storage-info" id="storage-info">0 docs · 0 KB</div>
        </div>
      </aside>

      <!-- Main Content -->
      <main id="main-content">

        <!-- Editor Panel -->
        <div id="panel-editor" class="panel active">
          <div class="editor-toolbar">
            <div class="doc-title-wrap">
              <input type="text" id="doc-title" placeholder="Untitled Document" class="doc-title-input" />
              <span class="save-indicator" id="save-indicator">●</span>
            </div>
            <div class="toolbar-actions">
              <button class="tool-btn" onclick="formatText('bold')" title="Bold">𝐁</button>
              <button class="tool-btn" onclick="formatText('italic')" title="Italic">𝐼</button>
              <button class="tool-btn" onclick="insertHeading(1)" title="H1">H1</button>
              <button class="tool-btn" onclick="insertHeading(2)" title="H2">H2</button>
              <button class="tool-btn" onclick="insertCodeBlock()" title="Code">⌨</button>
              <div class="toolbar-sep"></div>
              <button class="tool-btn ai-tool-btn" onclick="quickAI('continue')" title="AI: Continue writing">✨ Continue</button>
              <button class="tool-btn ai-tool-btn" onclick="quickAI('improve')" title="AI: Improve selection">⚡ Improve</button>
              <button class="tool-btn ai-tool-btn" onclick="quickAI('fixgrammar')" title="AI: Fix grammar">✓ Fix</button>
              <div class="toolbar-sep"></div>
              <button class="tool-btn" onclick="saveCurrentDoc()" title="Save">💾</button>
              <div class="export-wrap">
                <button class="tool-btn" onclick="toggleExportMenu()" title="Export" id="export-btn">⬇ Export</button>
                <div class="export-menu hidden" id="export-menu">
                  <button onclick="exportAs('pdf')">📕 Export as PDF</button>
                  <button onclick="exportAs('docx')">📘 Export as DOCX</button>
                  <button onclick="exportAs('txt')">📄 Export as TXT</button>
                </div>
              </div>
            </div>
          </div>
          <div id="editor" contenteditable="true" spellcheck="true" placeholder="Start writing... Everything is saved locally and encrypted."></div>
          <div class="editor-statusbar">
            <span id="word-count">0 words</span>
            <span id="char-count">0 chars</span>
            <span id="last-saved">Not saved</span>
          </div>
        </div>
