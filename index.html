<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhantomPen OS — Private Creative Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app">
    <!-- Boot Screen -->
    <div id="boot-screen">
      <div class="boot-inner">
        <div class="boot-logo">
          <span class="ghost-icon">◈</span>
          <h1>PhantomPen<span class="os-tag">OS</span></h1>
        </div>
        <div class="boot-bar-wrap">
          <div class="boot-bar"><div class="boot-fill"></div></div>
        </div>
        <p class="boot-status">Initializing secure workspace...</p>
      </div>
    </div>
    <!-- Unlock Screen -->
    <div id="unlock-screen" class="hidden">
        <div class="unlock-inner">
          <div class="lock-icon">🔒</div>
          <h2>Enter Passphrase</h2>
          <p class="unlock-sub">All data is encrypted locally. Nothing leaves your device.</p>
          <input type="password" id="passphrase-input" placeholder="Enter passphrase..." autocomplete="off" />
          <button id="unlock-btn" class="btn-primary">Unlock Workspace</button>
          <button id="create-btn" class="btn-ghost">Create New Vault</button>
          <p class="unlock-hint" id="unlock-hint"></p>
        </div>
      </div>
  
      <!-- Main Workspace -->
      <div id="workspace" class="hidden">
        <!-- Sidebar -->
        <aside id="sidebar">
          <div class="sidebar-header">
            <span class="ghost-icon-sm">◈</span>
            <span class="brand-sm">PhantomPen<em>OS</em></span>
            <button id="lock-btn" title="Lock Workspace">🔒</button>
          </div>
  
          <div class="sidebar-section">
            <div class="section-label">WORKSPACE</div>
            <button class="nav-btn active" data-panel="editor" onclick="switchPanel('editor')">
              <span>✏️</span> Editor
            </button>
            <button class="nav-btn" data-panel="files" onclick="switchPanel('files')">
              <span>📁</span> Files
            </button>
            <button class="nav-btn" data-panel="history" onclick="switchPanel('history')">
              <span>🕐</span> History
            </button>
            <button class="nav-btn" data-panel="share" onclick="switchPanel('share')">
              <span>🔗</span> Share
            </button>
            <button class="nav-btn" data-panel="settings" onclick="switchPanel('settings')">
              <span>⚙️</span> Settings
            </button>
          </div>
  
          <div class="sidebar-section">
            <div class="section-label">DOCUMENTS</div>
            <div id="doc-list"></div>
            <button class="new-doc-btn" onclick="newDocument()">+ New Document</button>
          </div>
  
          <div class="sidebar-footer">
            <div class="vault-status">
              <span class="status-dot"></span>
              <span id="vault-label">Vault locked</span>
            </div>
            <div class="storage-info" id="storage-info">0 docs · 0 KB</div>
          </div>
        </aside>
