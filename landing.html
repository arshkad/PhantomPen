<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhantomPen OS — Private Creative Workspace</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a78bfa">
<meta name="description" content="A fully offline, encrypted creative workspace with local AI. No cloud. No tracking. No lock-in.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #060608;
  --bg2: #0e0e12;
  --bg3: #16161c;
  --border: #ffffff0f;
  --border2: #ffffff1a;
  --text: #f0f0f8;
  --text2: #8888a8;
  --text3: #44445a;
  --green: #a78bfa;
  --green2: #7c3aed;
  --green-dim: #a78bfa15;
  --green-glow: #a78bfa40;
  --red: #ff5f7f;
  --amber: #ffbf5f;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

/* ── CUSTOM CURSOR ── */
.cursor {
  width: 8px; height: 8px;
  background: var(--green);
  border-radius: 50%;
  position: fixed; pointer-events: none;
  z-index: 9999;
  transition: transform 0.1s ease;
  mix-blend-mode: screen;
}
.cursor-ring {
  width: 32px; height: 32px;
  border: 1px solid var(--green-glow);
  border-radius: 50%;
  position: fixed; pointer-events: none;
  z-index: 9998;
  transition: transform 0.15s ease, width 0.2s, height 0.2s;
}

/* ── NOISE TEXTURE ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.4;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 20px 48px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 100;
  background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Playfair Display', serif;
  font-size: 20px; font-weight: 700;
  text-decoration: none; color: var(--text);
}
.nav-logo-icon {
  color: var(--green); font-size: 22px;
  animation: iconPulse 3s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100% { text-shadow: 0 0 10px var(--green-glow); }
  50% { text-shadow: 0 0 30px var(--green), 0 0 60px var(--green-glow); }
}
.nav-logo span { color: var(--green); }
.nav-links { display: flex; align-items: center; gap: 32px; }
.nav-links a {
  color: var(--text2); text-decoration: none;
  font-size: 13px; font-weight: 500; letter-spacing: 0.3px;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--text); }
.nav-cta {
  background: var(--green) !important;
  color: var(--bg) !important;
  padding: 8px 20px !important;
  border-radius: 6px !important;
  font-weight: 700 !important;
  transition: background 0.2s, transform 0.1s !important;
}
.nav-cta:hover { background: var(--green2) !important; transform: translateY(-1px); }

/* ── HERO ── */
#hero {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 120px 48px 80px;
  position: relative; overflow: hidden;
  text-align: center;
}

.hero-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black, transparent);
}

.hero-glow {
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--green-dim) 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  pointer-events: none;
}

.hero-inner { position: relative; z-index: 1; max-width: 800px; }

.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green-dim);
  border: 1px solid var(--green-glow);
  border-radius: 99px;
  padding: 6px 16px;
  font-size: 12px; font-weight: 600;
  color: var(--green); letter-spacing: 0.5px;
  margin-bottom: 32px;
  animation: fadeUp 0.6s ease both;
}
.badge-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  animation: iconPulse 2s ease-in-out infinite;
}

.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(48px, 8vw, 88px);
  line-height: 1.05;
  letter-spacing: -2px;
  margin-bottom: 24px;
  animation: fadeUp 0.6s ease 0.1s both;
}
.hero-title em {
  font-style: italic;
  color: var(--green);
}
.hero-title .strike {
  position: relative; color: var(--text3);
}
.hero-title .strike::after {
  content: '';
  position: absolute; left: 0; right: 0; top: 50%;
  height: 2px; background: var(--red);
  transform: rotate(-2deg);
}

.hero-sub {
  font-size: 18px; color: var(--text2); line-height: 1.7;
  max-width: 520px; margin: 0 auto 40px;
  animation: fadeUp 0.6s ease 0.2s both;
}

.hero-actions {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; flex-wrap: wrap;
  animation: fadeUp 0.6s ease 0.3s both;
}
.btn-main {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--green); color: var(--bg);
  padding: 14px 28px; border-radius: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 700;
  text-decoration: none; letter-spacing: 0.3px;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 0 0 0 var(--green-glow);
}
.btn-main:hover {
  background: var(--green2);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px var(--green-glow);
}
.btn-outline {
  display: inline-flex; align-items: center; gap: 8px;
  background: transparent; color: var(--text);
  padding: 14px 28px; border-radius: 8px;
  border: 1px solid var(--border2);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px; font-weight: 600;
  text-decoration: none;
  transition: border-color 0.2s, transform 0.15s;
}
.btn-outline:hover { border-color: var(--text2); transform: translateY(-2px); }

.hero-note {
  margin-top: 20px;
  font-size: 12px; color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  animation: fadeUp 0.6s ease 0.4s both;
}
.hero-note span { color: var(--green); }
