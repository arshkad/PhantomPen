<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhantomPen OS — Private Creative Workspace</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a78bfa">
<meta name="description" content="A fully offline, encrypted creative workspace with local AI. No cloud. No tracking. No lock-in.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #060608;
  --bg2: #0e0e12;
  --bg3: #16161c;
  --border: #ffffff0f;
  --border2: #ffffff1a;
  --text: #f0f0f8;
  --text2: #8888a8;
  --text3: #44445a;
  --green: #a78bfa;
  --green2: #7c3aed;
  --green-dim: #a78bfa15;
  --green-glow: #a78bfa40;
  --red: #ff5f7f;
  --amber: #ffbf5f;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  overflow-x: hidden;
  cursor: none;
}

/* ── CUSTOM CURSOR ── */
.cursor {
  width: 8px; height: 8px;
  background: var(--green);
  border-radius: 50%;
  position: fixed; pointer-events: none;
  z-index: 9999;
  transition: transform 0.1s ease;
  mix-blend-mode: screen;
}
.cursor-ring {
  width: 32px; height: 32px;
  border: 1px solid var(--green-glow);
  border-radius: 50%;
  position: fixed; pointer-events: none;
  z-index: 9998;
  transition: transform 0.15s ease, width 0.2s, height 0.2s;
}

/* ── NOISE TEXTURE ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.4;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 20px 48px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 100;
  background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Playfair Display', serif;
  font-size: 20px; font-weight: 700;
  text-decoration: none; color: var(--text);
}
.nav-logo-icon {
  color: var(--green); font-size: 22px;
  animation: iconPulse 3s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100% { text-shadow: 0 0 10px var(--green-glow); }
  50% { text-shadow: 0 0 30px var(--green), 0 0 60px var(--green-glow); }
}
.nav-logo span { color: var(--green); }
.nav-links { display: flex; align-items: center; gap: 32px; }
.nav-links a {
  color: var(--text2); text-decoration: none;
  font-size: 13px; font-weight: 500; letter-spacing: 0.3px;
  transition: color 0.2s;
}
